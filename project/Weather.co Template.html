<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather.co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-core:   #3a8fff;
      --blue-light:  #429bff;
      --blue-deep:   #2176f4;
      --cyan-accent: #40e6d9;
      --bg-dark:     #0f0f14;
      --bg-dark-2:   #16161e;
      --bg-dark-3:   #1e1e2a;
      --bg-light:    #f0f4ff;
      --bg-light-2:  #e4eaf8;
      --bg-light-3:  #ffffff;

      --bg:           var(--bg-dark);
      --bg-surface:   var(--bg-dark-2);
      --bg-raised:    var(--bg-dark-3);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.55);
      --text-tertiary:  rgba(255,255,255,0.28);
      --border:       rgba(255,255,255,0.08);
      --border-strong:rgba(255,255,255,0.14);
      --nav-bg:       rgba(15,15,20,0.82);
      --shadow: 0 2px 32px rgba(0,0,0,0.45);

      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius: 14px;
      --radius-sm: 8px;
      --nav-height: 64px;
    }

    [data-theme="light"] {
      --bg:           var(--bg-light);
      --bg-surface:   var(--bg-light-2);
      --bg-raised:    var(--bg-light-3);
      --text-primary: #0f0f1a;
      --text-secondary: rgba(15,15,26,0.55);
      --text-tertiary:  rgba(15,15,26,0.3);
      --border:       rgba(0,0,0,0.07);
      --border-strong:rgba(0,0,0,0.12);
      --nav-bg:       rgba(240,244,255,0.85);
      --shadow: 0 2px 32px rgba(58,143,255,0.10);
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      transition: background 0.35s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: var(--nav-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      gap: 0;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo-icon {
      width: 32px;
      height: 32px;
      position: relative;
      flex-shrink: 0;
    }

    .nav-wordmark {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      transition: color 0.25s ease;
    }

    .nav-wordmark span { color: var(--blue-core); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 40px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 450;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: color 0.2s, background 0.2s;
    }

    .nav-links a:hover { color: var(--text-primary); background: var(--border); }
    .nav-links a.active { color: var(--text-primary); }

    .nav-spacer { flex: 1; }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }

    .btn-ghost:hover { color: var(--text-primary); background: var(--border); opacity: 1; }

    .btn-primary {
      background: var(--blue-core);
      color: #fff;
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .theme-toggle:hover { background: var(--border); color: var(--text-primary); }

    /* ── PAGE ── */
    .page {
      min-height: 100vh;
      padding-top: var(--nav-height);
      display: flex;
      flex-direction: column;
    }

    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }

    .page-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      animation: pageIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    .logo-hero-icon { width: 96px; height: 96px; position: relative; }
    .logo-hero-wordmark { font-size: 36px; font-weight: 600; letter-spacing: -1px; color: var(--text-primary); transition: color 0.25s; }
    .logo-hero-wordmark span { color: var(--blue-core); }
    .logo-hero-tagline { font-size: 15px; color: var(--text-secondary); font-weight: 400; letter-spacing: 0.01em; }

    footer {
      padding: 24px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-text { font-size: 13px; color: var(--text-tertiary); }

    svg.brand-logo { overflow: visible; }

    /* ── PLACEHOLDER PAGE ── */
    .placeholder-page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 64px 32px; text-align: center; }
    .placeholder-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-core); background: color-mix(in srgb, var(--blue-core) 10%, transparent); border: 1px solid color-mix(in srgb, var(--blue-core) 20%, transparent); padding: 4px 10px; border-radius: 99px; }
    .placeholder-title { font-size: 42px; font-weight: 600; letter-spacing: -1.2px; color: var(--text-primary); line-height: 1.1; }
    .placeholder-sub { font-size: 16px; color: var(--text-secondary); max-width: 360px; line-height: 1.6; font-weight: 400; }
    .placeholder-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; width: 100%; max-width: 640px; }
    .placeholder-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; display: flex; flex-direction: column; gap: 8px; text-align: left; transition: border-color 0.2s, background 0.2s; }
    .placeholder-card:hover { border-color: var(--border-strong); background: var(--bg-raised); }
    .placeholder-card-icon { width: 32px; height: 32px; border-radius: 8px; background: color-mix(in srgb, var(--blue-core) 14%, transparent); display: flex; align-items: center; justify-content: center; color: var(--blue-core); }
    .placeholder-card-title { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .placeholder-card-sub { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }

    /* ── FEEDBACK FORM ── */
    .feedback-wrap { max-width: 560px; width: 100%; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 40px; }
    .feedback-header { display: flex; flex-direction: column; gap: 12px; }
    .feedback-form { display: flex; flex-direction: column; gap: 24px; }
    .fb-field { display: flex; flex-direction: column; gap: 8px; }
    .fb-label { font-size: 13px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .fb-optional { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
    .fb-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fb-type-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 450; transition: border-color 0.2s, background 0.2s, color 0.2s; }
    .fb-type-card:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .fb-type-card.selected { border-color: var(--blue-core); background: color-mix(in srgb, var(--blue-core) 10%, transparent); color: var(--blue-core); }
    .fb-type-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .fb-type-label { text-align: center; line-height: 1.3; }

    .fb-stars { display: flex; align-items: center; gap: 4px; }
    .fb-star { background: none; border: none; padding: 2px; cursor: pointer; color: var(--border-strong); transition: color 0.15s, transform 0.15s; line-height: 0; }
    .fb-star:hover, .fb-star.active { color: #f5c842; transform: scale(1.15); }
    .fb-rating-label { font-size: 13px; color: var(--text-secondary); margin-left: 6px; }

    .fb-textarea, .fb-input { font-family: var(--font-body); font-size: 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); padding: 12px 14px; width: 100%; resize: vertical; transition: border-color 0.2s, background 0.2s; outline: none; }
    .fb-textarea::placeholder, .fb-input::placeholder { color: var(--text-tertiary); }
    .fb-textarea:focus, .fb-input:focus { border-color: var(--blue-core); background: var(--bg-raised); }
    .fb-char-count { font-size: 12px; color: var(--text-tertiary); text-align: right; }
    .fb-error { font-size: 13px; color: #ff6b6b; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); border-radius: var(--radius-sm); padding: 10px 14px; }
    .fb-btn-primary { font-family: var(--font-body); font-size: 15px; font-weight: 500; background: var(--blue-core); color: #fff; border: none; border-radius: var(--radius-sm); padding: 13px 24px; cursor: pointer; transition: opacity 0.2s, transform 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
    .fb-btn-primary:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .fb-btn-primary:active:not(:disabled) { transform: translateY(0); }
    .fb-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .fb-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .feedback-success { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 48px 0; }
    .feedback-success-icon { width: 56px; height: 56px; border-radius: 50%; background: color-mix(in srgb, #40e6d9 10%, transparent); display: flex; align-items: center; justify-content: center; animation: popIn 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    .feedback-success-title { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; color: var(--text-primary); }
    .feedback-success-sub { font-size: 15px; color: var(--text-secondary); max-width: 360px; line-height: 1.6; }

    /* ── PRIVACY PAGE ── */
    .privacy-page { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 48px; }
    .privacy-header { display: flex; flex-direction: column; gap: 12px; }
    .privacy-body { display: flex; flex-direction: column; gap: 40px; }
    .privacy-section { display: flex; flex-direction: column; gap: 14px; }
    .privacy-section-title { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blue-core); }
    .privacy-section-body { display: flex; flex-direction: column; gap: 12px; }
    .privacy-section-body p { font-size: 15px; line-height: 1.7; color: var(--text-secondary); text-wrap: pretty; }
    .privacy-list { list-style: none; display: flex; flex-direction: column; gap: 8px; padding: 0; }
    .privacy-list li { font-size: 15px; line-height: 1.6; color: var(--text-secondary); padding-left: 18px; position: relative; }
    .privacy-list li::before { content: '—'; position: absolute; left: 0; color: var(--text-tertiary); font-size: 13px; }
    .privacy-list strong { color: var(--text-primary); font-weight: 500; }
    .privacy-row { display: flex; gap: 14px; align-items: flex-start; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
    .privacy-row-icon { width: 32px; height: 32px; border-radius: 8px; background: color-mix(in srgb, var(--blue-core) 12%, transparent); display: flex; align-items: center; justify-content: center; color: var(--blue-core); flex-shrink: 0; margin-top: 1px; }
    .privacy-row-label { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
    .privacy-row-text { font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); }
    .privacy-link { color: var(--blue-core); font-weight: 500; }

    /* ── PRODUCTS PAGE ── */
    .products-wrap { max-width: 800px; width: 100%; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 40px; }
    .products-hero { display: flex; align-items: flex-start; gap: 48px; }
    .products-hero-left { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .products-title { font-size: 38px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.15; color: var(--text-primary); text-wrap: pretty; }
    .products-desc { font-size: 15px; line-height: 1.7; color: var(--text-secondary); max-width: 420px; text-wrap: pretty; }
    .products-cta-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .products-cta-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--blue-core); color: #fff; font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: var(--radius-sm); text-decoration: none; transition: opacity 0.2s, transform 0.15s; }
    .products-cta-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .products-cta-ghost { font-size: 14px; font-weight: 450; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
    .products-cta-ghost:hover { color: var(--text-primary); }
    .products-meta-row { display: flex; align-items: center; gap: 16px; padding-top: 4px; }
    .products-meta-item { display: flex; flex-direction: column; gap: 2px; }
    .products-meta-val { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .products-meta-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
    .products-meta-divider { width: 1px; height: 28px; background: var(--border); }
    .products-hero-right { display: flex; flex-direction: column; align-items: center; gap: 14px; flex-shrink: 0; }
    .products-app-icon { width: 120px; height: 120px; border-radius: 28px; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(58,143,255,0.15); }
    .products-platform-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .products-tag { font-size: 11px; font-weight: 500; color: var(--text-tertiary); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 99px; padding: 3px 9px; }
    .products-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
    .products-tab { font-family: var(--font-body); font-size: 14px; font-weight: 450; color: var(--text-secondary); background: none; border: none; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.2s, border-color 0.2s; }
    .products-tab:hover { color: var(--text-primary); }
    .products-tab.active { color: var(--text-primary); border-bottom-color: var(--blue-core); font-weight: 500; }
    .products-feature-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .products-feature-row { display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .products-feature-row:last-child { border-bottom: none; }
    .products-feature-row:hover { background: var(--bg-surface); }
    .products-feature-check { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, #40e6d9 12%, transparent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .products-feature-label { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
    .products-feature-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

    /* ── LOGIN MODAL ── */
    .login-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 500; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .login-modal { position: relative; background: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: 20px; padding: 40px 36px 32px; width: 100%; max-width: 400px; box-shadow: 0 24px 80px rgba(0,0,0,0.4); animation: modalIn 0.3s cubic-bezier(0.22,1,0.36,1) both; display: flex; flex-direction: column; gap: 24px; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .login-close { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .login-close:hover { background: var(--border); color: var(--text-primary); }
    .login-header { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .login-logo { width: 56px; height: 56px; background: #0f0f14; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
    .login-title { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; color: var(--text-primary); }
    .login-sub { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-pw-wrap { position: relative; }
    .login-pw-wrap .fb-input { padding-right: 42px; }
    .login-pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 4px; display: flex; align-items: center; transition: color 0.2s; }
    .login-pw-toggle:hover { color: var(--text-secondary); }
    .login-forgot { display: flex; justify-content: flex-end; margin-top: -8px; }
    .login-link { font-size: 13px; color: var(--blue-core); text-decoration: none; cursor: pointer; transition: opacity 0.2s; }
    .login-link:hover { opacity: 0.75; }
    .login-footer-note { font-size: 12px; color: var(--text-tertiary); text-align: center; line-height: 1.6; }

    /* ── EMPLOYEE DASHBOARD ── */
    .dash-wrap { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); z-index: 400; animation: fadeIn 0.25s ease both; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; height: var(--nav-height); padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--nav-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); gap: 32px; }
    .dash-header-left { display: flex; align-items: center; gap: 32px; flex: 1; }
    .dash-logo-btn { display: flex; align-items: center; gap: 11px; background: none; border: none; cursor: pointer; text-decoration: none; flex-shrink: 0; }
    .dash-wordmark { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; color: var(--text-primary); transition: color 0.25s ease; }

    .dash-header-user-info { display: flex; flex-direction: column; gap: 1px; }

    .dash-alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .level-info .dash-alert-dot { background: var(--blue-core); }
    .level-warn .dash-alert-dot { background: #f5c842; }
    .level-success .dash-alert-dot { background: #40e6d9; }

<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function WeatherIcon({ size = 32 }) {
  const id = `grad-${size}`;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" className="brand-logo">
      <defs>
        <linearGradient id={id} x1="30" y1="10" x2="80" y2="70" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#429bff" />
          <stop offset="100%" stopColor="#2176f4" />
        </linearGradient>
      </defs>
      <path d="M10 60 A40 40 0 0 1 90 60 Z" fill={`url(#${id})`} />
      <rect x="10" y="60" width="80" height="4" rx="2" fill="#40e6d9" opacity="0.95" />
    </svg>
  );
}

function HeroLogo() {
  const [drawn, setDrawn] = useState(false);
  const [lineW, setLineW] = useState(0);
  useEffect(() => {
    const t1 = setTimeout(() => setDrawn(true), 300);
    const t2 = setTimeout(() => setLineW(100), 600);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  const heroId = 'hero-grad';
  return (
    <div className="logo-hero">
      <svg width="96" height="72" viewBox="0 0 96 72" fill="none" style={{ overflow: 'visible' }}>
        <defs>
          <linearGradient id={heroId} x1="10" y1="0" x2="86" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#429bff" />
            <stop offset="100%" stopColor="#2176f4" />
          </linearGradient>
        </defs>
        <path d="M4 58 A44 44 0 0 1 92 58 Z" fill={`url(#${heroId})`} style={{ opacity: drawn ? 1 : 0, transition: 'opacity 0.6s cubic-bezier(0.22,1,0.36,1)' }} />
        <rect x={48 - lineW * 0.44} y="58" width={lineW * 0.88} height="4" rx="2" fill="#40e6d9" style={{ transition: 'x 0.5s cubic-bezier(0.22,1,0.36,1), width 0.5s cubic-bezier(0.22,1,0.36,1)' }} />
      </svg>
      <div className="logo-hero-wordmark">Weather<span>.co</span></div>
      <div className="logo-hero-tagline">The weather but better</div>
    </div>
  );
}

function Nav({ theme, onToggleTheme, navLinks, activePage, onNavigate, onMembersClick }) {
  return (
    <nav>
      <a className="nav-logo" href="#" onClick={(e) => { e.preventDefault(); onNavigate(0); }}>
        <span className="nav-logo-icon"><WeatherIcon size={32} /></span>
        <span className="nav-wordmark">Weather<span>.co</span></span>
      </a>
      <ul className="nav-links">
        {navLinks.map((l, i) => (
          <li key={l}>
            <a href="#" className={activePage === i ? 'active' : ''} onClick={(e) => { e.preventDefault(); onNavigate(i); }}>{l}</a>
          </li>
        ))}
      </ul>
      <div className="nav-spacer" />
      <div className="nav-actions">
        <button className="btn btn-primary" onClick={onMembersClick}>Members</button>
        <button className="theme-toggle" onClick={onToggleTheme} title={theme === 'dark' ? 'Switch to light' : 'Switch to dark'}>
          {theme === 'dark' ? (
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="3.5" stroke="currentColor" strokeWidth="1.4" />
              <line x1="8" y1="1" x2="8" y2="3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="8" y1="13" x2="8" y2="15" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="1" y1="8" x2="3" y2="8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="13" y1="8" x2="15" y2="8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="2.93" y1="2.93" x2="4.34" y2="4.34" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="11.66" y1="11.66" x2="13.07" y2="13.07" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="2.93" y1="13.07" x2="4.34" y2="11.66" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              <line x1="11.66" y1="4.34" x2="13.07" y2="2.93" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
            </svg>
          ) : (
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6 6 0 1 0 8 8z" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          )}
        </button>
      </div>
    </nav>
  );
}

function Footer() {
  return (
    <footer>
      <WeatherIcon size={18} />
      <span className="footer-text">© 2026 Weather.co — All rights reserved</span>
    </footer>
  );
}

function HomePage() {
  return (
    <div className="page-view">
      <div className="page-content">
        <HeroLogo />
      </div>
    </div>
  );
}

function IconGrid() { return <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.3" /><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.3" /><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.3" /><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.3" /></svg>; }
function IconMsg() { return <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3h12v8H9l-3 2v-2H2V3z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" /></svg>; }
function IconBell() { return <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2a4 4 0 0 0-4 4v3l-1 1h10l-1-1V6a4 4 0 0 0-4-4z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" /><path d="M6.5 12a1.5 1.5 0 0 0 3 0" stroke="currentColor" strokeWidth="1.3" /></svg>; }
function IconCloud() { return <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M12 10.5H4a3 3 0 1 1 .5-5.95A4 4 0 1 1 12 7.5a2 2 0 0 1 0 3z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" /></svg>; }
function IconMap() { return <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3l4 1.5L10 3l4 1.5v9L10 12l-4 1.5L2 12V3z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" /><line x1="6" y1="4.5" x2="6" y2="13.5" stroke="currentColor" strokeWidth="1.3" /><line x1="10" y1="3" x2="10" y2="12" stroke="currentColor" strokeWidth="1.3" /></svg>; }
function IconStar() { return <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2l1.5 3.5L13 6l-2.5 2.5.5 3.5L8 10.5 5 12l.5-3.5L3 6l3.5-.5L8 2z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" /></svg>; }

function ProductsPage() {
  const [activeTab, setActiveTab] = useState('overview');
  const tabs = [{ id: 'overview', label: 'Overview' }, { id: 'features', label: 'Features' }, { id: 'watch', label: 'Apple Watch' }];
  return (
    <div className="page-view">
      <div className="products-wrap">
        <div className="products-hero">
          <div className="products-hero-left">
            <div className="placeholder-badge"><WeatherIcon size={12} />Weather.co App</div>
            <h1 className="products-title">The weather app<br />that respects your time.</h1>
            <p className="products-desc">Accurate, beautiful, and private. Weather.co gives you exactly what you need — conditions, forecasts, and alerts — without the noise.</p>
            <div className="products-cta-row">
              <a className="products-cta-primary" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11 8.5A4 4 0 0 1 8 14a4 4 0 0 1-4-4 4 4 0 0 1 4-4 3 3 0 0 0 3-3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/><circle cx="11" cy="3.5" r="1" fill="currentColor"/></svg>Download on App Store</a>
              <a className="products-cta-ghost" href="#">Learn more →</a>
            </div>
            <div className="products-meta-row">
              <div className="products-meta-item"><span className="products-meta-val">4.9</span><span className="products-meta-label">App Store rating</span></div>
              <div className="products-meta-divider" />
              <div className="products-meta-item"><span className="products-meta-val">Free</span><span className="products-meta-label">Always</span></div>
              <div className="products-meta-divider" />
              <div className="products-meta-item"><span className="products-meta-val">watchOS</span><span className="products-meta-label">+ iOS</span></div>
            </div>
          </div>
          <div className="products-hero-right">
            <div className="products-app-icon"><WeatherIcon size={72} /></div>
            <div className="products-platform-tags">
              <span className="products-tag">iOS 17+</span>
              <span className="products-tag">watchOS 10+</span>
              <span className="products-tag">iPhone & iPad</span>
            </div>
          </div>
        </div>
        <div className="products-tabs">
          {tabs.map(tab => <button key={tab.id} className={`products-tab${activeTab === tab.id ? ' active' : ''}`} onClick={() => setActiveTab(tab.id)}>{tab.label}</button>)}
        </div>
        {activeTab === 'overview' && (
          <div className="placeholder-grid">
            {[{ icon: <IconCloud />, title: 'Hyper-local conditions', desc: 'Real-time temperature, humidity, wind, UV, and pressure.' }, { icon: <IconMap />, title: 'Live radar', desc: 'Animated precipitation radar updated every 5 minutes.' }, { icon: <IconBell />, title: 'Smart alerts', desc: 'Push notifications only when weather actually affects your day.' }, { icon: <IconStar />, title: 'Beautiful widgets', desc: 'Lock screen, home screen, and standby widgets designed to be glanceable.' }, { icon: <IconGrid />, title: 'Privacy first', desc: 'Location is never stored or sold. Everything runs on-device.' }, { icon: <IconMsg />, title: 'No subscription', desc: 'Every feature is free. No paywalls, no premium tier.' }].map(card => (
              <div className="placeholder-card" key={card.title}>
                <div className="placeholder-card-icon">{card.icon}</div>
                <div className="placeholder-card-title">{card.title}</div>
                <div className="placeholder-card-sub">{card.desc}</div>
              </div>
            ))}
          </div>
        )}
        {activeTab === 'features' && (
          <div className="products-feature-list">
            {[{ label: 'Current conditions', detail: 'Temp, feels like, humidity, wind speed & direction, UV index, visibility, pressure, dew point' }, { label: 'Hourly forecast', detail: '48-hour hour-by-hour breakdown with precipitation probability and cloud cover' }, { label: '10-day forecast', detail: 'Daily highs/lows, sunrise/sunset times, and dominant conditions at a glance' }, { label: 'Precipitation radar', detail: 'Animated live radar overlay with zoom, pan, and timeline scrubber' }, { label: 'Severe weather alerts', detail: 'Government-issued warnings delivered instantly as push notifications' }, { label: 'Air quality index', detail: 'Real-time AQI with pollutant breakdown and health recommendations' }, { label: 'Widgets & complications', detail: 'Lock screen, home screen, StandBy, and Apple Watch complications in multiple sizes' }, { label: 'Multiple locations', detail: 'Add unlimited saved locations and switch between them instantly' }, { label: 'Dark & light mode', detail: 'Fully adaptive UI that respects your system appearance setting' }].map((f, i) => (
              <div className="products-feature-row" key={i}>
                <div className="products-feature-check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3 3 6-6" stroke="#40e6d9" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg></div>
                <div><div className="products-feature-label">{f.label}</div><div className="products-feature-detail">{f.detail}</div></div>
              </div>

        {activeTab === 'watch' && (
          <div className="placeholder-grid" style={{ gridTemplateColumns: 'repeat(2, 1fr)' }}>

function FeedbackPage() {
  const [type, setType] = useState('feature');
  const [rating, setRating] = useState(0);
  const [hoverRating, setHoverRating] = useState(0);
  const [message, setMessage] = useState('');
  const [email, setEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  function validate() {
    if (!message.trim()) return 'Please write a message before submitting.';
    if (message.trim().length < 10) return 'Message is too short — tell us a bit more.';
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'That email address doesn\'t look right.';
    return '';
  }

  function handleSubmit(e) {
    e.preventDefault();
    const err = validate();
    if (err) { setError(err); return; }
    setError('');
    setSubmitting(true);
    setTimeout(() => { setSubmitting(false); setSubmitted(true); }, 1200);
  }

  function handleReset() {
    setType('feature');
    setRating(0);
    setMessage('');
    setEmail('');
    setSubmitted(false);
    setError('');
  }

  const types = [
    { id: 'feature', label: 'Feature request', icon: <IconStar /> },
    { id: 'bug', label: 'Bug report', icon: <IconGrid /> },
    { id: 'general', label: 'General feedback', icon: <IconMsg /> },
  ];

  if (submitted) {
    return (
      <div className="page-view">
        <div className="feedback-wrap">
          <div className="feedback-success">
            <div className="feedback-success-icon">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#40e6d9" strokeWidth="1.5" />
                <path d="M8 14l4 4 8-8" stroke="#40e6d9" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </div>
            <h2 className="feedback-success-title">Thanks for the feedback</h2>
            <p className="feedback-success-sub">Every submission is read by a real person on the Weather.co team. We'll be in touch if we have questions{email ? ` at ${email}` : ''}.</p>
            <button className="fb-btn-primary" onClick={handleReset}>Send more feedback</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="page-view">
      <div className="feedback-wrap">
        <div className="feedback-header">
          <div className="placeholder-badge"><WeatherIcon size={12} />Feedback</div>
          <h1 className="placeholder-title">We'd love to hear from you</h1>
          <p className="placeholder-sub">Every message is read by a human. No bots, no auto-close.</p>
        </div>
        <form className="feedback-form" onSubmit={handleSubmit} noValidate>
          <div className="fb-field">
            <label className="fb-label">What kind of feedback?</label>
            <div className="fb-type-grid">
              {types.map(tp => (
                <button key={tp.id} type="button" className={`fb-type-card${type === tp.id ? ' selected' : ''}`} onClick={() => setType(tp.id)}>
                  <span className="fb-type-icon">{tp.icon}</span>
                  <span className="fb-type-label">{tp.label}</span>
                </button>
              ))}
            </div>
          </div>
          <div className="fb-field">
            <label className="fb-label">How would you rate the app?  <span className="fb-optional">optional</span></label>
            <div className="fb-stars">
              {[1,2,3,4,5].map(n => (
                <button key={n} type="button" className={`fb-star${n <= (hoverRating || rating) ? ' active' : ''}`} onMouseEnter={() => setHoverRating(n)} onMouseLeave={() => setHoverRating(0)} onClick={() => setRating(r => r === n ? 0 : n)} aria-label={`${n} star${n !== 1 ? 's' : ''}`}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.25 5.5L20 9.25l-4 3.75 1 5.5L12 16l-5 2.5 1-5.5-4-3.75 5.75-.75L12 3z" fill="currentColor" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round" /></svg>
                </button>
              ))}
              {rating > 0 && <span className="fb-rating-label">{['','Terrible','Poor','Okay','Good','Love it'][rating]}</span>}
            </div>
          </div>
          <div className="fb-field">
            <label className="fb-label" htmlFor="fb-message">{type === 'feature' ? 'Describe the feature you\'d like' : type === 'bug' ? 'Describe the bug' : 'Your message'}</label>
            <textarea id="fb-message" className="fb-textarea" placeholder={type === 'feature' ? 'e.g. I\'d love to see hourly UV index on the Watch complication…' : type === 'bug' ? 'e.g. The radar layer crashes when I zoom in on iOS 18…' : 'Tell us anything — good, bad, or in between…'} value={message} onChange={e => { setMessage(e.target.value); setError(''); }} rows={5} />
            <div className="fb-char-count">{message.length} chars</div>
          </div>
          <div className="fb-field">
            <label className="fb-label" htmlFor="fb-email">Email  <span className="fb-optional">optional — only if you'd like a reply</span></label>
            <input id="fb-email" type="email" className="fb-input" placeholder="you@example.com" value={email} onChange={e => { setEmail(e.target.value); setError(''); }} />
          </div>
          {error && <div className="fb-error">{error}</div>}
          <button type="submit" className={`fb-btn-primary${submitting ? ' loading' : ''}`} disabled={submitting}>
            {submitting ? <span className="fb-spinner" /> : 'Send feedback'}
          </button>
        </form>
      </div>
    </div>
  );
}

function LoginModal({ onClose, onOpenDashboard }) {
  const [step, setStep] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    if (!email) { setError('Please enter your work email.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('Enter a valid email address.'); return; }
    if (!password) { setError('Please enter your password.'); return; }
    if (password.length < 6) { setError('Password must be at least 6 characters.'); return; }
    setError('');
    setLoading(true);
    setTimeout(() => { setLoading(false); setStep('success'); }, 1400);
  }

  function handleBackdrop(e) {
    if (e.target === e.currentTarget) onClose();
  }

  return (
    <div className="login-backdrop" onClick={handleBackdrop}>
      <div className="login-modal" role="dialog" aria-modal="true" aria-label="Employee login">
        <button className="login-close" onClick={onClose} aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
          </svg>
        </button>

        {step === 'login' ? (
          <>
            <div className="login-header">
              <div className="login-logo"><WeatherIcon size={36} /></div>
              <h2 className="login-title">Employee portal</h2>
              <p className="login-sub">Sign in with your Weather.co work account.</p>
            </div>
            <form className="login-form" onSubmit={handleSubmit} noValidate>
              <div className="fb-field">
                <label className="fb-label" htmlFor="login-email">Work email</label>
                <input id="login-email" type="email" className="fb-input" placeholder="you@weather.co" value={email} onChange={e => { setEmail(e.target.value); setError(''); }} autoComplete="email" />
              </div>
              <div className="fb-field">
                <label className="fb-label" htmlFor="login-pw">Password</label>
                <div className="login-pw-wrap">
                  <input id="login-pw" type={showPw ? 'text' : 'password'} className="fb-input" placeholder="••••••••" value={password} onChange={e => { setPassword(e.target.value); setError(''); }} autoComplete="current-password" />
                  <button type="button" className="login-pw-toggle" onClick={() => setShowPw(v => !v)} aria-label={showPw ? 'Hide password' : 'Show password'}>
                    {showPw ? (
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4z" stroke="currentColor" strokeWidth="1.3"/><circle cx="8" cy="8" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M3 3l10 10" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
                    ) : (
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4z" stroke="currentColor" strokeWidth="1.3"/><circle cx="8" cy="8" r="1.5" stroke="currentColor" strokeWidth="1.3"/></svg>
                    )}
                  </button>
                </div>
              </div>
              <div className="login-forgot">
                <a href="#" className="login-link" onClick={e => e.preventDefault()}>Forgot password?</a>
              </div>
              {error && <div className="fb-error">{error}</div>}
              <button type="submit" className={`fb-btn-primary${loading ? ' loading' : ''}`} disabled={loading}>
                {loading ? <span className="fb-spinner" /> : 'Sign in'}
              </button>
            </form>
            <p className="login-footer-note">Access restricted to Weather.co employees.<br />Problems? Contact <span className="login-link">it@weather.co</span></p>
          </>
        ) : (
          <div className="feedback-success">
            <div className="feedback-success-icon">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#40e6d9" strokeWidth="1.5" />
                <path d="M8 14l4 4 8-8" stroke="#40e6d9" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </div>
            <h2 className="feedback-success-title">Welcome back</h2>
            <p className="feedback-success-sub">You're signed in to the Weather.co employee portal.</p>
            <button className="fb-btn-primary" onClick={() => { onClose(); onOpenDashboard(email); }}>Go to dashboard →</button>
          </div>
        )}
      </div>
    </div>
  );
}

const PAGE_COMPONENTS = [HomePage, ProductsPage, FeedbackPage, UpdatesPage];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "navLink1": "Home",
  "navLink2": "Products",
  "navLink3": "Feedback",
  "navLink4": "Privacy",
  "showFooter": true,
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activePage, setActivePage] = useState(0);
  const [pageKey, setPageKey] = useState(0);
  const [showLogin, setShowLogin] = useState(false);
  const [showDashboard, setShowDashboard] = useState(false);
  const [loggedInUser, setLoggedInUser] = useState(null);

  const theme = t.theme;
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  const navLinks = [t.navLink1, t.navLink2, t.navLink3, t.navLink4].filter(Boolean);

  function handleNavigate(idx) {
    setActivePage(idx);
    setPageKey(k => k + 1);
  }

  const PageComponent = PAGE_COMPONENTS[activePage] || HomePage;

  return (
    <>
      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onOpenDashboard={(email) => { setLoggedInUser(email); setShowLogin(false); setShowDashboard(true); }} />}
      {showDashboard && <EmployeeDashboard user={loggedInUser} onSignOut={() => setShowDashboard(false)} />}

      <Nav theme={theme} onToggleTheme={() => setTweak('theme', theme === 'dark' ? 'light' : 'dark')} navLinks={navLinks} activePage={activePage} onNavigate={handleNavigate} onMembersClick={() => setShowLogin(true)} />

      <div className="page">
        <PageComponent key={pageKey} />
        {t.showFooter && <Footer />}
      </div>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={t.theme} options={['dark', 'light']} onChange={(v) => setTweak('theme', v)} />
        <TweakToggle label="Show footer" value={t.showFooter} onChange={(v) => setTweak('showFooter', v)} />
        <TweakSection label="Navigation links" />
        <TweakText label="Link 1" value={t.navLink1} onChange={(v) => setTweak('navLink1', v)} />
        <TweakText label="Link 2" value={t.navLink2} onChange={(v) => setTweak('navLink2', v)} />
        <TweakText label="Link 3" value={t.navLink3} onChange={(v) => setTweak('navLink3', v)} />
        <TweakText label="Link 4" value={t.navLink4} onChange={(v) => setTweak('navLink4', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
